name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # required for npm provenance attestation

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish  # configure required reviewers in GitHub Settings → Environments
    # Third-party actions are pinned to commit SHAs in this job because it holds
    # the OIDC publish credential. Dependabot keeps the SHAs current.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # needed to verify the tag is reachable from main

      - name: Verify tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi

      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm >= 11.5.1 is required for OIDC trusted publishing. Pinned (not
      # @latest) so an unreviewed npm release cannot run in the publish job.
      - run: npm install -g npm@11.20.0

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify dist
        run: |
          test -f dist/index.js
          test -f dist/index.mjs
          test -f dist/index.d.ts
          test -f dist/index.d.mts
          head -1 dist/index.js  | grep -q '"use client"'
          head -1 dist/index.mjs | grep -q '"use client"'

      - name: Publish with provenance
        run: npm publish --access public --provenance
